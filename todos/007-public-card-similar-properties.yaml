title: Блок «Похожие объекты» в публичной карточке
status: done
created_at: 20.05.2026
completed_at: 05.06.2026

description: |
  У конкурента (dars-capital.kz/property/31) внизу карточки — блок «Похожие
  объекты»: 3 карточки с фото, заголовком, районом, ценой и ключевыми
  характеристиками + кнопка «Смотреть все». Это удерживает клиента на сайте
  и повышает шансы конверсии.

  У нас такого блока нет. На текущем этапе подбор делаем на стороне Odoo
  (без обращения к EstateKit API) и алгоритмически (без привязки к заявке CRM —
  её пользователь может не иметь, открыв карточку по прямой ссылке).

  Критерии похожести (по убыванию важности):
  - Тип объекта (property_type) — обязательное совпадение
  - Город — обязательное совпадение
  - Район — приоритет тому же району, далее соседние
  - Цена ±20–25%
  - Площадь ±20%
  - Количество комнат ±1 (для жилья)
  - Статус — только активные (новый/одобренный/в продаже), не sold/archived/draft

  Берём топ-6 объектов, отсортированных по близости. Показываем 3 на десктопе
  и 1–2 на мобильных, остальные — на отдельной странице через «Смотреть все».

recommendation: |
  Архитектура (соблюдая DDD-структуру проекта):
  - Сервис `src/property/services/similar_picker/` с фасадом и реализациями
  - Фасад: `pick(property_id: int, limit: int = 6) -> list[estate.property]`
  - Реализация делится на 2 шага:
    1. Фильтр-кандидаты (SQL/ORM запрос с обязательными критериями)
    2. Скоринг и ранжирование (взвешенная сумма близости по каждому критерию)
  - Скоринг — отдельный класс, веса вынести в `config.py`

  Контроллер публичной карточки вызывает фасад и передаёт список объектов в
  шаблон. Шаблон рендерит карточки с фото, заголовком, адресом, ценой,
  площадью/комнатами.

  Кнопка «Смотреть все» — пока ведёт на список всех активных объектов с
  фильтром по типу и району. Отдельная страница «похожие на конкретный
  объект» — out of scope (можно сделать позже, если будет нужно).

  Делегировать реализацию агенту `python-architecture` — сервисная архитектура
  по гайду проекта, нужны протоколы и фабрика.

  На карточке блок занимает ширину 100%, ниже sticky-зоны. Стилизация — как у
  конкурента: фото, ниже заголовок, ниже строка «район», ниже цена жирно,
  ниже строка «площадь м² • участок Х сот.».

solution: |
  Блок «Похожие объекты» — подбор на стороне Odoo (без EstateKit API, без CRM):
  - Сервис src/property/services/similar_picker/ (фасад pick(prop, limit=6)):
      candidate_provider.py — ORM-поиск кандидатов: тот же property_type, тот же
        city_id, state ∈ {active, published, mls_listed}, id != prop.id;
      similarity_scorer.py + proximity_calculator.py — взвешенный скоринг
        (тот же район, цена ±25%, площадь ±20%, комнаты ±1 для жилья);
      ranker.py — сортировка по убыванию score, топ-limit.
      Веса/ACTIVE_STATES/RESIDENTIAL_TYPES — в config.py.
  - Сервис src/public_view/services/similar_card_builder/ (build(properties)) —
    презентация: url (публичная страница похожего через get_or_create_url),
    image_url (thumb главного фото через get_or_create_token, None если нет фото),
    title, address, price, specs «N м² • K комн.».
  - Добавлен метод get_or_create_token на модель токена (возвращает строку).
  Шаблон: блок .similar-grid (3 карточки на десктопе, 2 на планшете, 1 на
  мобильных) на всю ширину под двухколоночным макетом.

  ОТКЛОНЕНИЕ ОТ ЗАДАЧИ: кнопка «Смотреть все» НЕ добавлена — в модуле нет
  публичной страницы-листинга объектов, ссылка вела бы в никуда (риск битой
  ссылки перед клиентом). Показываем топ-N без «Смотреть все». Если понадобится —
  отдельная задача на публичный листинг.
