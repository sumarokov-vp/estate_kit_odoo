title: Шаблон описания — связка поля description и EAV-атрибутов по разделам
status: done
created_at: 20.05.2026
completed_at: 05.06.2026

description: |
  Сейчас в публичной карточке (`public_view_page`):
  - Блок «Характеристики» — плоская таблица label/value со ВСЕМИ атрибутами вперемешку
  - Блок «Особенности» — chip-список бинарных признаков
  - Блок «Описание» — текст из поля `description`

  У конкурента (dars-capital.kz/property/31) подача намного сильнее: описание
  агента — это структурированный сторителлинг с подзаголовками-разделами
  (📍 Локация / 🏡 Об объекте / 🏠 Основной дом / 🌿 Территория / 🔒 Безопасность /
  ⚙️ Коммуникации / 🛋 Комплектация / 🛏 Планировка). Атрибуты упомянуты inline
  внутри разделов.

  Решение: оставляем оба источника данных (поле `description` от агента + EAV-
  атрибуты), но меняем подачу. Сначала идёт продающее описание агента целиком,
  ниже — атрибуты, сгруппированные по смысловым разделам.

  Группировка атрибутов в код (не настраивается из UI):
  - Параметры: площади, комнаты, этаж, этажность, год постройки, материал
  - Территория: площадь участка, назначение, ландшафт (для домов/таунхаусов/участков)
  - Комфорт: ремонт, мебель, санузлы, балкон/лоджия, отопление
  - Безопасность: видеонаблюдение, охрана, домофон, консьерж
  - Коммуникации: газ, электричество, вода, канализация, интернет
  - Бытовая техника: чипами

  Разделы пропускаются, если внутри нет заполненных атрибутов.

recommendation: |
  В контроллере публичной карточки сформировать структуру:
  ```python
  sections = [
      {"title": "Параметры", "icon": "📐", "rows": [...]},
      {"title": "Территория", "icon": "🌿", "rows": [...]},
      ...
  ]
  ```
  Каждая `row` — tuple (label, value) или (label, value, unit).
  Маппинг «атрибут → раздел» — отдельный модуль данных в контроллере
  (словарь или dataclass), чтобы легко править.

  В шаблоне поле `description` рендерится первым блоком (как сейчас, но шире и
  с увеличенным шрифтом), ниже идёт цикл по `sections`. Каждый раздел —
  карточка с заголовком, иконкой и таблицей атрибутов.

  Блок «Особенности» (chip-список) остаётся, но переносится в раздел «Комфорт»
  или выделяется отдельной карточкой между описанием и разделами.

  Контроллерная логика разрастается — стоит вынести подготовку данных публичной
  карточки в отдельный сервис в `src/property/services/public_card_renderer/`
  по архитектурному гайду проекта (фасад + реализация + конфиг разделов).
  Делегировать `python-architecture` агенту.

solution: |
  Описание + EAV-атрибуты по смысловым разделам:
  - sections_layout.py — декларативный маппинг «атрибут→раздел»: Параметры (📐),
    Территория (🌿, для house/townhouse/land), Комфорт (🛋), Безопасность (🔒),
    Коммуникации (⚙️). Пустые ряды/разделы пропускаются.
  - section_row_resolver.py + sections_builder.py — сборка rows (label,value),
    селекшены через selection_labeler.py, булевы → «Да».
  - Контроллер отдаёт values["sections"] = list[{"title","icon","rows"}].
  Шаблон: блок description рендерится первым (увеличенный шрифт/межстрочный),
  ниже — «Особенности» (chip-список features), затем цикл по sections —
  каждый раздел отдельной карточкой с иконкой, заголовком и .specs-таблицей.
  Плоский блок «Характеристики» (characteristics) удалён, ключ убран из values.
  Сервисная архитектура — по гайду проекта (фасад public_card_renderer +
  реализации + protocols/ + factory), сделана агентом python-architecture.
