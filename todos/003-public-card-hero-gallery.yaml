title: Hero-галерея публичной карточки — главное фото + грид превью
status: open
created_at: 20.05.2026
completed_at: null

description: |
  Сейчас галерея в `public_view_page` рендерится как равномерная сетка квадратов
  (`grid-template-columns: repeat(3, 1fr)`). Это «каталоговая» подача — не даёт
  ощущения premium-объекта.

  У конкурента (dars-capital.kz/property/31) hero-блок устроен иначе:
  - Слева — крупное главное фото (60–65% ширины)
  - Справа — сетка 2×2 из 4 миниатюр
  - Клик по любому изображению открывает lightbox для просмотра всех фото

  Нужно переделать первый экран галереи в этом стиле. Если фото меньше 5 —
  fallback на текущую сетку или показ доступных.

recommendation: |
  В шаблоне `public_view_page` блок галереи разделить на два слоя:
  1. «Hero» — главное фото (первое из `images`) + сетка 2×2 из следующих 4
  2. Lightbox остаётся прежним — клик по любому фото в hero открывает его

  Кнопка «Показать все фото (N)» — нижний правый угол hero-блока, открывает
  lightbox с первого фото.

  CSS Grid вёрстка:
  ```
  .hero-gallery {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 8px;
  }
  .hero-main { grid-row: span 2; }
  .hero-thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  ```

  На мобильных — fallback на текущий грид-блок (одна колонка свайпов).

  Lightbox оставить без изменений — он уже умеет навигацию и счётчик.

