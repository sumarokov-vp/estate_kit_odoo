title: Sticky-панель с ценой и контактами справа от карточки
status: done
created_at: 20.05.2026
completed_at: 05.06.2026

description: |
  Сейчас цена в `public_view_page` выводится одной строкой в заголовочной
  карточке. При скролле длинной карточки клиент теряет цену и кнопки связи —
  чтобы написать агенту, нужно скроллить наверх.

  У конкурента (dars-capital.kz/property/31) реализован прилипающий блок
  справа: крупная цена + три CTA-кнопки (WhatsApp / Связаться с консультантом /
  Позвонить). Виден при любом положении скролла.

  Нужна такая же sticky-панель, привязанная к контактам ответственного агента
  объекта (поле user_id на estate.property).

recommendation: |
  Источник контактов:
  - Телефон агента — из `user_id.partner_id.phone` (или `mobile`)
  - WhatsApp — тот же телефон, формат `https://wa.me/<phone>?text=<prefilled>`
  - «Связаться» — открывает форму обратной связи (модалка) или mailto

  Предзаполненный текст для WhatsApp:
  «Здравствуйте, интересует объект <название> (ссылка <url>)».

  Вёрстка: контейнер карточки переходит на 2 колонки на десктопе:
  - Левая (основной контент): 65–70%
  - Правая (sticky CTA): 30–35%, `position: sticky; top: 24px;`

  На мобильных — fix-bar внизу экрана с двумя кнопками (WhatsApp + Позвонить),
  цена показывается в основном потоке.

  Если у объекта нет ответственного агента — fallback на общие контакты
  агентства (компании из `res.company`). Это решение для крайнего случая,
  по умолчанию агент должен быть назначен.

solution: |
  Sticky-панель с ценой и контактами:
  - contact_builder.py (+ phone_resolver/tel_href_builder/bot_url_builder) даёт
    contact = {"name","phone","tel_href","bot_url"}:
      name = prop.user_id.name;
      phone = user_id.partner_id.phone/mobile, fallback на res.company;
      tel_href = "tel:" + phone без пробелов/скобок;
      bot_url = ссылка на customer bot.
  - ИЗМЕНЕНИЕ ОТНОСИТЕЛЬНО ИСХОДНОЙ ЗАДАЧИ (по требованию пользователя):
    вместо WhatsApp — ссылка на нашего customer bot, который общается с клиентом.
    bot_url_builder: https://t.me/{estate_kit.customer_bot_username}?start=property_{token}
    (payload property_<token> — бот резолвит объект по публичному токену).
    КОНТРАКТ для команды customer bot: бот должен обрабатывать deeplink
    start=property_<token>.
  Шаблон: двухколоночный .layout (контент + .aside sticky top:16px), в панели —
  крупная цена, карточка агента, CTA «Написать в Telegram» (cta.tg) и
  «Позвонить» (cta.call). На мобильных панель скрыта, внизу — фикс-бар
  .mobile-bar с теми же двумя кнопками; цена остаётся в потоке (в панели).
