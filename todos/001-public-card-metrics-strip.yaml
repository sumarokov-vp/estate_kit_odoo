title: Hero-стрип ключевых метрик в публичной карточке объекта
status: open
created_at: 20.05.2026
completed_at: null

description: |
  В публичной карточке объекта (`addons/estate_kit/views/public_view_templates.xml`,
  template `public_view_page`) сейчас все характеристики свалены в один блок
  «Характеристики» в виде плоского списка label/value. Клиент не видит ключевые
  параметры в первый момент просмотра.

  Нужно добавить hero-полосу под заголовком: крупные цифры с подписями для
  4 ключевых метрик объекта. Полоса должна реагировать на тип объекта:
  - apartment: Площадь / Комнаты / Этаж / Год постройки
  - house, townhouse: Площадь дома / Комнаты / Участок / Этажность
  - commercial: Площадь / Этаж / Назначение / Год постройки
  - land: Площадь участка / Назначение / Коммуникации (да/нет) / —

  Подача — как у конкурента (dars-capital.kz/property/31): большие числа,
  под ними тонкая подпись капсом, разделители-вертикальные линии.

recommendation: |
  Добавить новый блок в `public_view_page` сразу после заголовка/цены, до галереи.
  Логику выбора метрик по `property_type` вынести в контроллер, который рендерит
  публичную карточку — он формирует список tuples (label, value) для шаблона.
  Шаблон рендерит как стрип из 4 ячеек; если значение пустое — ячейка скрывается.

  Стили — inline в существующем `<style>` блоке шаблона, чтобы не плодить новые
  ассеты. CSS grid из 4 колонок, на мобильных — 2 колонки.

solution: null
