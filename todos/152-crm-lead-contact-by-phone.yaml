title: "Идентификация контакта по телефону при создании заявки"
status: done
created_at: 27.04.2026
completed_at: 27.04.2026

description: |
  При создании заявки через мини-карточку пользователь вводит имя и телефон.
  Система должна автоматически:
  1. Искать существующий контакт по введённому номеру телефона
  2. Если найден — подставить в поле "Контакт"
  3. Если не найден — создать новый контакт (res.partner) с введёнными именем и телефоном

recommendation: |
  Переопределить create() или логику quick_create для crm.lead:
  после сохранения выполнять поиск res.partner по phone/mobile,
  при отсутствии — создавать нового партнёра.
  Связано с задачей 149 (данные из мини-карточки не переносятся).

solution: |
  В сервис contact_matcher добавлен класс PartnerCreator (с протоколом IPartnerCreator).
  ContactMatcherService теперь после поиска по телефону, если партнёр не найден,
  создаёт нового res.partner с name=lead.contact_name и phone=lead.phone, затем
  привязывает его к лиду через partner_id. Сервис вызывается в LeadCreatorService.after_create()
  (хук уже существовал).
