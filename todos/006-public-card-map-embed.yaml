title: Встроенная карта объекта в публичной карточке
status: open
created_at: 20.05.2026
completed_at: null

description: |
  В публичной карточке (`public_view_page`) нет блока с картой объекта.
  У конкурента (dars-capital.kz/property/31) карта Yandex Maps встроена прямо
  в карточку — клиент видит расположение, не открывая внешние сервисы.

  У наших объектов координаты уже есть в модели (поля долготы/широты в группе
  «Координаты» формы `estate.property`). Используем 2GIS — основной картовой
  партнёр проекта.

  Нужно добавить блок с embed-картой + кнопку «Открыть в 2GIS» для перехода
  в полноразмерное приложение/сайт.

recommendation: |
  Источник координат: поля долготы/широты на `estate.property`. Если координат
  нет — блок карты не показывается (вместо него только текстовый адрес выше).

  Embed-вариант: iframe с публичной картой 2GIS:
  `https://2gis.kz/almaty?m=<lon>,<lat>/16`
  (точный формат уточнить — у 2GIS есть отдельный widget API для embed,
   если iframe ограничен через X-Frame-Options).

  Альтернатива: статичная картинка с точкой через API 2GIS Static Maps +
  кликабельная ссылка на полноценную карту. Решение принять при реализации,
  отталкиваясь от лицензии и текущей интеграции 2GIS в проекте.

  Расположение в карточке: между блоком атрибутов и блоком «Похожие объекты»
  (либо до описания — обсуждаемо, ориентир — порядок у конкурента: карта
   идёт после «Характеристики», перед «Похожие»).

  Стили: контейнер 16:9 (`aspect-ratio: 16/9`), скруглённые углы, под картой
  кнопка «Открыть в 2GIS».

solution: null
