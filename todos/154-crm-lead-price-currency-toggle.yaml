title: "Переключатель валюты (доллар/тенге) для диапазона цены в заявке"
status: done
created_at: 27.04.2026
completed_at: 27.04.2026

description: |
  В карточке заявки есть поля "Цена от" и "Цена до" (диапазон бюджета клиента).
  Необходимо добавить переключатель валюты: доллар (USD) или тенге (KZT).
  Переключатель единый для обоих полей.

recommendation: |
  Добавить поле выбора валюты (Selection или Many2one на res.currency)
  рядом с полями диапазона цены в модели и представлении crm.lead.
  Уточнить у заказчика: хранить одну валюту на заявку или отдельно для each поля.

solution: |
  В модель crm.lead добавлено поле search_price_currency (Selection USD/KZT, default USD)
  и выведено в представление рядом с search_price_min/search_price_max на вкладке
  «Потребность». Существующие Monetary-поля цены не тронуты, чтобы не сломать матчинг.
