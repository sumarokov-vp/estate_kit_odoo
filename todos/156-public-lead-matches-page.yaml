title: "Публичная страница подборки объектов для заявки (без авторизации)"
status: done
created_at: 27.04.2026
completed_at: 27.04.2026

description: |
  Сейчас для каждого объекта есть публичная карточка без авторизации:
  /estate_kit/view/<token> (вкладка «Медиа» в карточке объекта).

  Нужно сделать аналогичную публичную страницу для заявки — страницу подборки,
  которую менеджер может отправить клиенту. Клиент открывает её без авторизации
  и видит список подобранных объектов с переходом на публичную карточку каждого.

  Пример существующей страницы объекта:
  http://royalestate.smartist.dev/estate_kit/view/6e581eec5f9b4c9fa3b98ba8fb5a22e1

recommendation: |
  1. Добавить уникальный токен на модель crm.lead (аналог токена объекта)
  2. Реализовать Odoo HTTP-контроллер: /estate_kit/leads/<token>
     — публичный маршрут, без авторизации
     — отображает список matched объектов из заявки
     — каждый объект — ссылка на существующую публичную карточку /estate_kit/view/<token>
  3. Добавить кнопку "Копировать ссылку подборки" в карточку заявки (вкладка Медиа или шапка)
  4. Шаблон страницы: минималистичный, адаптивный (клиент открывает с телефона)

solution: |
  Реализована публичная страница подборки объектов для лида:
  - Маршрут /estate_kit/leads/<token> (auth=none), token = crm.lead.lead_code
  - Контроллер src/public_view/controllers/lead_matches.py — отображает matched-объекты
    в стадиях new/viewed/selected, скрывая rejected
  - QWeb-шаблон views/lead_matches_public_template.xml — адаптивная mobile-first сетка
    карточек с превью, ценой, характеристиками и адресом
  - Каждая карточка ведёт на существующую публичную карточку объекта /estate_kit/view/<token>
  - Превью используют thumb-эндпоинт того же публичного токена объекта
  - В UrlBuilderService добавлен метод lead_matches_url(token)
  - На crm.lead добавлено compute-поле lead_public_url
  - В форме лида (вкладка Telegram) добавлено поле "Ссылка подборки"
    с виджетом CopyClipboardChar для копирования менеджером
