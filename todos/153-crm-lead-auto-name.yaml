title: "Автоматическое название лида: Тип объекта + Имя клиента"
status: done
created_at: 27.04.2026
completed_at: 27.04.2026

description: |
  Сейчас название лида формируется по умолчанию как "possibility + имя клиента".
  Нужно изменить логику: название должно автоматически составляться из
  типа объекта и имени клиента.

  Формат: "Тип объекта · Имя клиента"
  Примеры: "Дом · Иван Иванов", "Коммерция · Мария Петрова"

recommendation: |
  Добавить @api.depends или переопределить compute/onchange на поле name в crm.lead,
  формируя название из типа объекта и имени партнёра.
  Учесть случай, когда один из компонентов ещё не заполнен.

solution: |
  Создан сервис src/lead/services/name_builder/ с фасадом NameBuilderService.build(property_type, contact_name)
  и маппингом PROPERTY_TYPE_LABELS. В модели crm.lead:
  - в create() имя формируется из типа объекта и contact_name (если name не задан),
  - добавлен @api.onchange("search_property_type", "contact_name", "partner_id"),
    который перестраивает имя при изменении этих полей в форме.
  Формат: "Тип · Имя", если один из компонентов пуст — выводится только заполненный.
