title: "Кнопка «Подобрать» не работает — матчинг-сервис недоступен"
status: done
created_at: 27.04.2026
completed_at: 27.04.2026

description: |
  При нажатии кнопки "Подобрать" в карточке заявки выдаётся ошибка:

    Недопустимая операция
    Сервис подбора вернул ошибку: HTTPConnectionPool(host='localhost', port=8001):
    Max retries exceeded with url: /search
    (Caused by NewConnectionError: Failed to establish a new connection: [Errno 111] Connection refused)

  Сервис подбора (матчинг) обращается к localhost:8001, который не отвечает.
  Вероятно, матчинг-сервис не запущен или неправильно настроен адрес.

recommendation: |
  1. Проверить, запущен ли матчинг-сервис на production-сервере (порт 8001)
  2. Проверить настройки подключения в ir.config_parameter (адрес/порт сервиса подбора)
  3. Убедиться, что сервис стартует автоматически (systemd/supervisor)
  4. Если сервис не реализован — зафиксировать как заглушку и скрыть кнопку до готовности

solution: |
  Добавлено доменное исключение MatchingServiceUnavailableError в
  matching_client/exceptions.py. HttpClient.post оборачивает
  requests.ConnectionError и requests.Timeout в это исключение. В
  crm_lead_matching.action_match_properties оно ловится отдельно и
  превращается в UserError с понятным сообщением: «Сервис подбора
  временно недоступен. Обратитесь к администратору.» Прочие
  RequestException продолжают обрабатываться по-старому (показ деталей
  ответа).
