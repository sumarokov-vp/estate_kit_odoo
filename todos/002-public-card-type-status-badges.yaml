title: Плашки «Тип / Статус» над заголовком публичной карточки
status: done
created_at: 20.05.2026
completed_at: 05.06.2026

description: |
  У конкурента (dars-capital.kz/property/31) над заголовком объекта расположены
  две плашки: тип объекта (ВИЛЛА / АПАРТАМЕНТЫ / КОММЕРЦИЯ) и статус (В ПРОДАЖЕ).
  Это даёт быструю визуальную категоризацию ещё до чтения названия.

  В нашей публичной карточке (`public_view_page`) этих плашек нет.

  Нужно вывести два бэйджа над `<div class="title">`:
  - Тип объекта (по `property_type`): Квартира / Дом / Таунхаус / Коммерция / Участок
  - Статус (по `state` / стадии): В продаже / Забронирован / Продан / Снят
    (только статусы, которые имеют смысл показывать клиенту)

recommendation: |
  Контроллер публичной карточки готовит два значения: `type_label`, `state_label`.
  В шаблоне над заголовком — flex-ряд из двух `<span class="badge">`.

  Цветовая дифференциация:
  - Статус «В продаже» — акцентный цвет (синий/зелёный)
  - Статус «Забронирован» — жёлтый
  - Статус «Продан» — серый
  - Тип объекта — нейтральный (outline)

  Стили — в существующем `<style>` блоке шаблона.

  Если объект в статусе, который не должен светиться публично (черновик,
  на модерации) — карточка должна возвращать 404 на уровне контроллера,
  а не показывать плашку. Проверить текущую логику доступа в контроллере.

solution: |
  Плашки тип/статус над заголовком:
  - type_label_resolver.py — label типа объекта (Квартира/Дом/Таунхаус/Коммерция/Земля).
  - state_badges.py + state_badge_builder.py — маппинг state→{"label","kind"}:
    active/published/mls_listed → «В продаже» (kind=active, зелёный);
    sold/mls_sold → «Продан» (kind=sold, серый);
    unpublished/mls_removed → «Снят» (kind=withdrawn, жёлтый);
    остальные → плашки статуса нет.
  Шаблон: .badges над .title, type — outline, статус — цвет по kind.

  Политика видимости (404): по согласованию с пользователем выбран строгий
  вариант из задачи. Контроллер view_page: _PUBLIC_STATES =
  {active, published, unpublished, sold, mls_listed, mls_removed, mls_sold};
  если prop.state не в whitelist → request.not_found(). Внутренние статусы
  (черновик, internal_review, moderation, legal_review, rejected, duplicate,
  imported, archived) публично не светятся.
  ВНИМАНИЕ для деплоя: ранее разосланные клиентам ссылки на объекты в
  неопубликованных статусах после обновления вернут 404 — это ожидаемое
  поведение по требованию задачи.
