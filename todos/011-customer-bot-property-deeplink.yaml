title: Customer bot — обработка диплинка start=property_<token>
status: open
created_at: 05.06.2026
completed_at: null

description: |
  В публичной карточке объекта (редизайн, задача 004) CTA-кнопка «Написать в
  Telegram» ведёт на нашего customer bot со ссылкой вида:

    https://t.me/<estate_kit.customer_bot_username>?start=property_<token>

  где <token> — публичный токен просмотра объекта
  (estate.property.public.view.token). Формирует ссылку Odoo-сервис
  bot_url_builder в src/property/services/public_card_renderer/.

  Сейчас Odoo-сторона готова и отдаёт ссылку, но САМ customer bot пока не умеет
  обрабатывать payload `property_<token>` — клиент, нажавший кнопку, просто
  откроет бота без контекста объекта.

recommendation: |
  В customer bot реализовать обработку deeplink-параметра start=property_<token>:
  - распарсить payload, извлечь токен;
  - резолвить объект по токену (через Odoo XML-RPC или EstateKit API —
    в зависимости от того, к чему подключён customer bot);
  - стартовать диалог с привязкой к конкретному объекту (показать карточку,
    предложить связаться с агентом / задать вопрос).

  Это кросс-продуктовая задача (репозиторий customer bot, не odoo). Контракт
  диплинка зафиксирован здесь и в решении todos/004. До реализации на стороне
  бота кнопка работает как обычный переход в бота без контекста объекта.
