title: "Поле «Площадь участка» в потребностях для земли, коммерции и дома"
status: done
created_at: 27.04.2026
completed_at: 27.04.2026

description: |
  В разделе потребностей заявки для типов объектов "Земля", "Коммерция" и "Дом"
  должно отображаться поле "Площадь участка" (в дополнение к площади объекта).
  Для остальных типов (квартира и т.д.) это поле скрывается.

recommendation: |
  Добавить поле площади участка в модель/представление crm.lead (потребности)
  и настроить attrs/invisible по типу объекта: показывать только для
  Земля, Коммерция, Дом.

solution: |
  В модель crm.lead добавлены поля search_land_area_min и search_land_area_max
  (Float, digits=(10, 1)). В представлении они отображаются на вкладке «Потребность»
  с invisible="search_property_type not in ('land', 'commercial', 'house')".
