title: "Набор полей потребности зависит от типа объекта"
status: done
created_at: 27.04.2026
completed_at: 27.04.2026

description: |
  В полной карточке заявки раздел "Потребности" должен показывать разный набор полей
  в зависимости от выбранного типа объекта.

  Известные правила:
  - Коммерция: скрывать поле "Количество комнат"
  - Возможно, аналогичная логика для земли и других типов

recommendation: |
  Добавить attrs/invisible на поля потребностей в представлении crm.lead,
  привязав видимость к полю типа объекта. Уточнить полный список исключений
  по каждому типу у заказчика.

solution: |
  В представлении crm.lead (вкладка «Потребность») на поля search_rooms_min и
  search_rooms_max добавлен атрибут invisible="search_property_type == 'commercial'".
  Поля автоматически скрываются для коммерческой недвижимости.
