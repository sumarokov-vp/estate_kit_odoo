title: "Данные из мини-карточки не переносятся в полную карточку заявки"
status: done
created_at: 27.04.2026
completed_at: 27.04.2026

description: |
  При создании заявки через мини-карточку пользователь заполняет:
  - Тип сделки
  - Тип объекта
  - Имя и телефон контакта

  После нажатия "Создать" открывается полная карточка, но все эти поля остаются пустыми.

recommendation: |
  Проверить quick_create форму лида (crm.lead) — убедиться, что кастомные поля
  (тип сделки, тип объекта) включены в контекст создания и правильно маппятся.
  Контакт обрабатывается отдельно (см. задачу про идентификацию по телефону).

solution: |
  В quick_create форме (`crm_lead_view_form_quick_create_estate`) добавлено поле phone
  рядом с contact_name. Поля search_deal_type и search_property_type уже сохранялись
  через стандартный механизм vals при create() — после добавления phone все данные
  мини-карточки корректно попадают в полную карточку.
